name: Build and motion tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: dotnet test tests/Qsys.Motion.Tests/Qsys.Motion.Tests.csproj --configuration Release
      - run: dotnet build hosting/Qsys.Motion.IisHost/Qsys.Motion.IisHost.csproj --configuration Release
